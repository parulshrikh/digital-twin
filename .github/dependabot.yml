version: 2
updates:
  # requirements.txt / requirements-dev.txt at the repo root
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # actions/checkout, actions/setup-python, etc. in .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
